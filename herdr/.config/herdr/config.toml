# herdr configuration — managed by dotfiles.
#
# Only a few settings are pinned here; everything else uses herdr's defaults
# (it auto-detects agents with zero config). Run `herdr --default-config` to
# see the full set of options.
#
# NOTE: ~/.config/herdr/ also holds runtime state (herdr*.sock, herdr*.log,
# session.json, session-snapshots/, .plugins.lock). Those are git-ignored — only this file is
# tracked/stowed.

# Skip the first-run onboarding (we set our preferences below).
onboarding = false

[theme]
name = "tokyo-night"

# tokyo-night's stock `surface_dim` is only a shade off the panel background, so
# the selected space/agent in the sidebar is very hard to pick out — every agent
# row is bold, and the highlight was the only thing setting the current one
# apart. herdr 0.8.0 has no selection-specific style setting (the only levers are
# these 16 theme tokens, `ui.accent`, and the sidebar row templates, none of
# which can style "the selected row" on its own), so raising this token's
# contrast is the fix.
#
# `surface_dim` also paints the sidebar's outer border and the spaces/agents
# divider, so it has to work as a thin line as well as a fill — hence a mid-tone
# blue from the tokyo-night palette rather than something saturated.
[theme.custom]
surface_dim = "#33467c"

[keys]
# Match the tmux prefix (Ctrl-a) for muscle memory. Everything else keeps
# herdr's default keymap (pane nav prefix+h/j/k/l, splits prefix+v / prefix+-).
prefix = "ctrl+a"

[ui]
agent_panel_sort = "priority"

# A wider sidebar, so space and agent rows aren't truncated. herdr sizes it to
# the workspace names between min and max, starting from sidebar_width; the
# defaults are 26 (18–36). With no auto-split pane on the right any more, the
# room is better spent here.
sidebar_width = 40
sidebar_min_width = 32
sidebar_max_width = 48

# A distinct glyph per agent state (blocked, working, done, idle, unknown)
# rather than the default colour dots.
status_indicators = "symbols"

# Agent rows stay densely packed: herdr 0.9's row_gap default of 0. A blank
# line between rows (row_gap = 1, the pre-0.9 look) was tried and wasted space.

# Background-workspace notifications: silent, and shown by the OS notification
# service rather than herdr's in-app toast (the default is "off").
[ui.sound]
enabled = false

[ui.toast]
delivery = "system"
