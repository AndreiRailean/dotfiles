# Starship prompt — https://starship.rs/config/
# Clean, fast, and legible over SSH. Two lines: info, then the prompt char.

add_newline = true
command_timeout = 1000
# The default 30ms scan often times out on WSL's /mnt/c (Windows filesystem);
# raise it so language modules still render there without the warning.
scan_timeout = 100

format = """
$directory\
$git_branch\
$git_status\
${custom.devserver}\
$nodejs\
$python\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2000
format = "[ $duration]($style)"
style = "bold yellow"

# Language modules: show only inside relevant projects, kept terse.
[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"

[python]
symbol = " "
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
format = "[$symbol($version )]($style)"

# Dev-server port for THIS workspace — nothing at all when idle, so the
# segment's presence is the signal. Several worktrees of one project each run
# a dev server, and this reports only the one whose process was started here.
#
# Both keys run the same script on purpose: its exit status decides whether the
# segment renders, its stdout fills it. starship renders a passing `when` with
# empty output as the glyph wrapped around nothing, so a `when` of "true" would
# park a bare glyph in every serverless directory. The cost is that starship
# runs the script twice per prompt when a server is up.
#
# symbol is U+F233, the nerd-font server glyph. Written with printf because a
# private-use character does not survive an ordinary edit.
[custom.devserver]
command = "$HOME/.config/starship/devserver-port.sh"
when = "$HOME/.config/starship/devserver-port.sh"
symbol = " "
format = "[ $symbol$output]($style)"
style = "bold green"
